<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <title>台中GoSoon - 專業接送服務</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="image.png" alt="台中GoSoon Logo" class="logo-img">
            <div class="hero-text">在地深耕，優質接送服務</div>
            <div class="stats-grid">
                <div class="stat-box"><span>10+</span><br>年經驗</div>
                <div class="stat-box"><span>24H</span><br>全天候</div>
                <div class="stat-box"><span>600+</span><br>車隊</div>

            </div>
        </header>

        <section class="services">
            <h2>服務項目</h2>
            <div class="services-grid">
                <div class="card"><span>🚗</span><h3>24H叫車</h3></div>
                <div class="card"><span>🍺</span><h3>酒後代駕</h3></div>

                <div class="card"><h3>長途包車</h3></div>

                <div class="card"><span>🏥</span><h3>醫療陪同</h3></div>
            </div>
        </section>
    </div>

    <a href="https://line.me/R/ti/p/@nms3943c" class="floating-line-btn">
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/LINE_logo.svg" alt="LINE">
